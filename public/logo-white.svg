<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="ihash-gradient-white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(6, 6)">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="#151C3B" />
    <rect x="0.5" y="0.5" width="51" height="51" rx="13.5" stroke="url(#ihash-gradient-white)" stroke-opacity="0.6" stroke-width="1.5" />
    
    <rect x="13" y="20" width="26" height="3" rx="1.5" fill="url(#ihash-gradient-white)" />
    <rect x="13" y="29" width="26" height="3" rx="1.5" fill="url(#ihash-gradient-white)" />
    
    <path d="M22 13L18 39" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <path d="M34 13L30 39" stroke="url(#ihash-gradient-white)" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="35" cy="12" r="3" fill="#60A5FA" />
  </g>

  <!-- Typography: iHash Studios White -->
  <text x="70" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="-0.03em">
    iHash<tspan fill="#A855F7" font-weight="700">Studios</tspan>
  </text>
  
  <!-- Tagline: Century Gothic Regular -->
  <text x="71" y="48" font-family="'Century Gothic', CenturyGothic, AppleGothic, 'URW Gothic L', 'Poppins', sans-serif" font-size="7.5" font-weight="400" fill="#94A3B8" letter-spacing="0.22em">
    INNOVATION THROUGH SOFTWARE
  </text>
</svg>
