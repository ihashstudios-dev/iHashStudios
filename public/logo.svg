<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="ihash-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#245BFF" />
      <stop offset="100%" stop-color="#7628E8" />
    </linearGradient>
    <linearGradient id="ihash-subtle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#245BFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#7628E8" stop-opacity="0.12" />
    </linearGradient>
  </defs>

  <!-- Logo Mark Icon: Stylized i + Hash / Circuit Node -->
  <g transform="translate(6, 6)">
    <!-- Base geometric badge -->
    <rect x="0" y="0" width="52" height="52" rx="14" fill="#0D132A" />
    <rect x="0.5" y="0.5" width="51" height="51" rx="13.5" stroke="url(#ihash-gradient)" stroke-opacity="0.4" stroke-width="1" />
    
    <!-- Accent backdrop -->
    <rect x="4" y="4" width="44" height="44" rx="10" fill="url(#ihash-subtle)" />
    
    <!-- Hash Bars Horizontal -->
    <rect x="13" y="20" width="26" height="3" rx="1.5" fill="url(#ihash-gradient)" />
    <rect x="13" y="29" width="26" height="3" rx="1.5" fill="url(#ihash-gradient)" />
    
    <!-- Hash Bars Vertical (angled) -->
    <path d="M22 13L18 39" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <path d="M34 13L30 39" stroke="url(#ihash-gradient)" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Innovation Node Dot ('i' dot in the hash) -->
    <circle cx="35" cy="12" r="3" fill="#245BFF" />
  </g>

  <!-- Typography: iHash Studios -->
  <text x="70" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="#0D132A" letter-spacing="-0.03em">
    iHash<tspan fill="#7628E8" font-weight="700">Studios</tspan>
  </text>
  
  <!-- Tagline: Century Gothic Regular -->
  <text x="71" y="48" font-family="'Century Gothic', CenturyGothic, AppleGothic, 'URW Gothic L', 'Poppins', sans-serif" font-size="7.5" font-weight="400" fill="#5B647E" letter-spacing="0.22em">
    INNOVATION THROUGH SOFTWARE
  </text>
</svg>
